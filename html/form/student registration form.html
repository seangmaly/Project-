<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action=""  style="margin: auto;width: 30%;">
        <fieldset style="width: 100%;">
            <h3>Student Registration Form</h3>
            <label for="">Full Name:</label>
            <input type="text" name="full name" required><br><br>
            <label for="">Email Address:</label>
            <input type="email" name="eamil address" id="" required ><br><br>
            <label for="">Password:</label>
            <input type="password" name="password" required><br><br>
            <label for="">Date of birth:</label>
            <input type="date" name="date" required><br><br>
            <label for="">Gender:</label>
            <input type="radio" name="Female">
            <label for="">Female</label>
            <input type="radio" name="male">
            <label for="">male</label><br><br>
            <label for="">Course</label>
            <select name="Course" id="">
            <option value="HTML">HTML</option>
            </select><br><br>
            <label for=""> Skill You Have:</label><br>
            <input type="checkbox" name="html" id=""required>
            <label for="">HTML</label><br>
            <input type="checkbox" name="css" id=""required>
            <label for="">CSS</label><br>
            <input type="checkbox" name="javascript" id="">
            <label for="">JAVASCRIPT</label><br><br>
            <label for="">Additional Comments:</label><br>
            <textarea name="" id=""name="Comments" rows="5" cols="40" placeholder="Enter your Comments"></textarea><br><br>
            <label for="">Upload your file:</label><br><br>
            <input type="file" name="fieldset" id="" required><br><br>
            <button type="submit">Upload</button><br><br>
            <button>Register</button>
        </fieldset>
    </form>
</body>
</html>
