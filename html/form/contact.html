<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-image: url("https://i.pinimg.com/1200x/ad/39/ec/ad39ec70d8057d9815a4aa6a91043321.jpg");
        }
        .form{
            width: 350px;
            margin: 90px auto;
            padding: 60px;
            background-color: rgba(34, 44, 53, 0.413);
            border: 1px solid rgba(189, 189, 189, 0.274);
            border-radius: 20px;
        }
        .title-contact{
            color: rgb(248, 95, 7);
            font-size: 35px;
            text-align: center;
        }
        .sub-title{
            color: whitesmoke;
            text-align: center;
        }
        .Label-input{
            color: aliceblue;
            font-size: 25px;
        }
        .input-form{
            width: 98%;
            border: none;
            border-radius: 30px;
            font-style: initial;
            font-size: 20px;
            background-color: rgb(255, 255, 255);
            box-shadow: 0px 0px 8px 1px rgba(84, 116, 246, 0.242) inset;
            padding: 10px;
        }
    </style>
</head>
<body>
    <form action="" class="form">
        <h1 class="title-contact">Contact for more</h1>
        <p class="sub-title"><i>Please contact for more.</i>
        <br>
        Can contact if you have something to me.</p>
        <label for="" class="Label-input">First name</label><br>
        <input class="input-form" type="text" name="first Name" placeholder="Enter your First Name" ><br><br>
        <label for="" class="Label-input">Last Name</label><br>
        <input class="input-form" type="text" name="last Name" placeholder="Enter your Last Name"><br><br>
        <label for="" class="Label-input">Email Address</label><br>
        <input class="input-form" type="email" name="email" id="" placeholder="Enter your Eamil">
    </form>
</body>
</html>
