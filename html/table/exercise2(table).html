<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
</head>
<body>
   <table border="1"cellpadding="10px" width="700px" cellspacing="0" >
    <tr>
        <th colspan="5">Table</th>
    </tr>
    <tr>
        <th>A</th>
        <th colspan="3">B</th>
        <th>c</th>
    </tr>
    <tr>
        <th rowspan="2">D</th>
        <th colspan="5">F</th>
    </tr>
    <tr>
        <th >G</th>
        <th colspan="3">H</th>
    </tr>
    <tr>
        <th colspan="4">J</th>
        <th >I</th>
    </tr>

    <tr>
        <th>K</th>
        <th>L</th>
        <th>M</th>
        <th rowspan="2" colspan="3">N</th>
     
    </tr>
    <tr>
        <th colspan="3">O</th>
      
    </tr>
 
   </table> 
</body>
</html>
