<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <table border="1" width="700px"
    >
        <tr>
            <th colspan="4">Student Information</th>
        </tr>
        <tr>
            <th>No</th>
            <th>Name</th>
            <th>Gender</th>
            <th>Result</th>
        </tr>
        <tr>
            <td>001</td>
            <td>Dara</td>
            <td>M</td>
            <td rowspan="2">Pass</td>
        </tr>
        <tr>
            <td>002</td>
            <td>Jack</td>
            <td>M</td>
        
        </tr>
    </table>
</body>
</html>
